name: E2E

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-read-only-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUTTER_E2E_ENTRANCE: ${{ vars.BUTTER_E2E_ENTRANCE || 'butter+' }}
      E2E_READ_MAX_NATIVE_FEE: ${{ vars.E2E_READ_MAX_NATIVE_FEE || '20000000000000000' }}
      E2E_READ_AMOUNT: ${{ vars.E2E_READ_AMOUNT || '100000000000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:read-only
